spring.application.name=teamup

# MySQL (contenedor Docker, ver docker-compose.yml). Se puede cambiar con variables de entorno
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME y SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:mysql://localhost:3306/teamup_campus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=root123

# Desarrollo: Hibernate actualiza el esquema. En producción se usaría Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Sesión segura
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax