<button class="menu-toggle" type="button" id="menuToggle" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false"><i class="bi bi-list"></i></button>
<form class="search" role="search">
  <i class="bi bi-search" aria-hidden="true"></i>
  <input id="buscador" type="search" placeholder="Buscar proyectos o tareas..." aria-label="Buscar en la plataforma">
</form>
<div class="topbar__user">
  <div class="dropdown bell-wrap">
    <button class="bell" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Notificaciones">
      <i class="bi bi-bell"></i><span class="bell__dot" id="bellDot" hidden></span>
    </button>
    <ul class="dropdown-menu dropdown-menu-end bell-menu">
      <li class="bell-menu__title">Notificaciones (<span id="bellCount">0</span>)</li>
      <li><ul class="list-unstyled m-0" id="bellItems"></ul></li>
      <li class="bell-menu__empty" id="bellEmpty">No tienes avisos pendientes.</li>
    </ul>
  </div>
  <div class="dropdown">
    <button class="user-btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
      <span id="userAvatar"></span><span class="small" id="userName"></span>
    </button>
    <ul class="dropdown-menu dropdown-menu-end">
      <li><h6 class="dropdown-header" id="userEmail"></h6></li>
      <li><button class="dropdown-item small" type="button" data-action="logout"><i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión</button></li>
    </ul>
  </div>
</div>

<template id="tpl-notification">
  <li><a class="dropdown-item bell-item" data-attr="href:href" data-class="nivelClass"><i class="bi" data-class="iconoClass"></i><span data-text="texto"></span></a></li>
</template>
